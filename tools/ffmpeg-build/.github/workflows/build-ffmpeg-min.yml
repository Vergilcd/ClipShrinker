name: Build slim ffmpeg
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - run: bash ./build-ffmpeg-min.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-slim
          path: dist/*.exe
